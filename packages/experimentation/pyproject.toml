[project]
name = "aegis-experimentation"
version = "0.1.0"
description = "Aegis-Alpha research experimentation foundation"
requires-python = ">=3.12"
dependencies = [
    "aegis-events",
    "aegis-storage",
    "aegis-orchestration",
    "pydantic",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
aegis-events = { workspace = true }
aegis-storage = { workspace = true }
aegis-orchestration = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "strict"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
]
