[project]
name = "aegis-storage"
version = "0.1.0"
description = "Aegis-Alpha storage package"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "greenlet>=3.1.1",
    "psycopg2-binary>=2.9.12",
    "sqlalchemy>=2.0.49",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
