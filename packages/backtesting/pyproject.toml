[project]
name = "aegis-backtesting"
version = "0.1.0"
description = "Aegis-Alpha backtesting orchestration package"
requires-python = ">=3.12"
dependencies = [
    "aegis-events",
    "aegis-signals",
    "aegis-storage",
    "numpy",
    "pandas",
    "pydantic",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
aegis-events = { workspace = true }
aegis-signals = { workspace = true }
aegis-storage = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "strict"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
]
