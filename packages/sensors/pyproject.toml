[project]
name = "aegis-sensors"
version = "0.1.0"
description = "Aegis-Alpha sensors package"
requires-python = ">=3.12"
dependencies = [
    "aegis-events",
    "httpx",
    "prometheus-client",
    "pydantic",
    "tenacity",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
aegis-events = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
