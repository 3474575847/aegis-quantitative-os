[project]
name = "aegis-api"
version = "0.1.0"
description = "Aegis-Alpha api application"
requires-python = ">=3.12"
dependencies = [
    "aegis-core",
    "aegis-events",
    "aegis-observability",
    "aegis-sensors",
    "aegis-storage",
    "aegis-signals",
    "aegis-experimentation",
    "fastapi>=0.115.0",
    "httpx",
    "uvicorn>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
aegis-core = { workspace = true }
aegis-events = { workspace = true }
aegis-observability = { workspace = true }
aegis-sensors = { workspace = true }
aegis-storage = { workspace = true }
aegis-signals = { workspace = true }
aegis-experimentation = { workspace = true }
