[project]
name = "aegis-worker"
version = "0.1.0"
description = "Aegis-Alpha worker application"
requires-python = ">=3.12"
dependencies = [
    "aegis-core",
    "aegis-events",
    "aegis-observability",
    "aegis-sensors",
    "aegis-signals",
    "aegis-storage",
    "httpx",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
aegis-core = { workspace = true }
aegis-events = { workspace = true }
aegis-observability = { workspace = true }
aegis-sensors = { workspace = true }
aegis-signals = { workspace = true }
aegis-storage = { workspace = true }
