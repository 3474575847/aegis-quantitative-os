[project]
name = "aegis-alpha"
version = "0.1.0"
description = "Autonomous quantitative research engine"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
workspace = { members = ["apps/*", "packages/*"] }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG", "PTH", "RET", "RUF"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
show_error_codes = true

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "ruff>=0.15.12",
]
