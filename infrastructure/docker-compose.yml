services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      - POSTGRES_DB=aegis
      - POSTGRES_PASSWORD=postgres
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    depends_on:
      - db
      - redis
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/aegis
    ports:
      - '8000:8000'

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/aegis

volumes:
  pgdata:
